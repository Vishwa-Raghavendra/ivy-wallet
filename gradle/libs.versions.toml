[versions]
# Gradle plugins versions
android-reporting = "1.2.0" # You need to specify the correct version for this plugin
ben-manes-versions = "0.51.0"
kotlin = "2.0.21"
ksp-plugin = "2.0.21-1.0.27" # Combined KSP plugin version (kotlin-version-ksp-extension-version)
hilt = "2.56.1"
android-gradlePlugin = "8.11.1"

[libraries]
# Place your library dependencies here, if any.

[plugins]
# Plugin definitions
android-reporting = { id = "android-reporting", version.ref = "android-reporting" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Uses the base Kotlin version
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-plugin" } # Uses the combined KSP plugin version
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-application = { id = "com.android.application", version.ref = "android-gradlePlugin" }